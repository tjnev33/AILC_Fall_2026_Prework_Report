<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>AILC Pre-Work Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Password gate matching the March session report: single deliberate dark look. */
:root{--navy:#1e3a5f;--navy-deep:#0f2440;--teal:#1a7a6d;--white:#fff;--ink-soft:#8d95a6;--red:#e07a66;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Source Sans 3",-apple-system,"Segoe UI",sans-serif;background:var(--navy-deep);color:var(--white);display:flex;align-items:center;justify-content:center;padding-inline:16px;overflow:auto}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 80%,rgba(26,122,109,.08) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 20%,rgba(184,148,46,.06) 0%,transparent 60%),radial-gradient(circle at 50% 50%,#1e3a5f 0%,#0f2440 100%);z-index:0}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:460px;padding-block:20px}
@media (prefers-reduced-motion:no-preference){.wrap{animation:up .8s ease-out}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}}
.card{background:rgba(255,255,255,.04);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:44px 38px;box-shadow:0 24px 80px rgba(0,0,0,.4)}
@media (max-width:500px){.card{padding:34px 22px}}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal),#15635a);display:grid;place-items:center;box-shadow:0 4px 16px rgba(26,122,109,.25)}
.logo-text{font-family:"Fraunces",Georgia,serif;font-size:18px;line-height:1.2}
.logo-text span{display:block;font-family:"Source Sans 3",sans-serif;font-size:11px;font-weight:500;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
h1{font-family:"Fraunces",Georgia,serif;font-size:25px;font-weight:600;line-height:1.3;margin:0 0 8px}
.sub{font-size:15px;color:var(--ink-soft);line-height:1.6;margin:0 0 26px}
label{display:block;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.field{position:relative}
input{width:100%;padding:14px 48px 14px 16px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;color:var(--white);font:16px "Source Sans 3",sans-serif;outline:none;transition:border-color .25s,background .25s}
input::placeholder{color:rgba(255,255,255,.28)}
input:focus{border-color:var(--teal);background:rgba(26,122,109,.08);box-shadow:0 0 0 3px rgba(26,122,109,.15)}
input.error{border-color:var(--red)}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:rgba(255,255,255,.4);cursor:pointer;padding:6px}
.eye:hover,.eye:focus-visible{color:rgba(255,255,255,.8)}
.msg{font-size:13px;color:var(--red);min-height:20px;margin-top:6px}
button.go{width:100%;margin-top:10px;padding:14px 24px;background:linear-gradient(135deg,var(--teal),#15635a);color:var(--white);font:600 15px "Source Sans 3",sans-serif;border:0;border-radius:10px;cursor:pointer;box-shadow:0 4px 20px rgba(26,122,109,.3)}
button.go:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid #b8942e;outline-offset:2px}
.foot{text-align:center;margin-top:24px;font-size:12px;color:rgba(255,255,255,.3);line-height:1.5}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots i{width:8px;height:8px;border-radius:50%;opacity:.7}
</style>

      <button class="go" id="go" type="submit">Access Report</button>
    </form>

</div>

const pwd=document.getElementById('pwd'),msg=document.getElementById('msg'),go=document.getElementById('go');
document.getElementById('eye').addEventListener('click',()=>{pwd.type=pwd.type==='password'?'text':'password';});
pwd.addEventListener('input',()=>{msg.textContent='';pwd.classList.remove('error');});
async function sha256(m){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('');}
document.getElementById('gate').addEventListener('submit',async e=>{
  e.preventDefault();
  const v=pwd.value;
  if(!v){pwd.classList.add('error');msg.textContent='Please enter a password.';return;}
  go.disabled=true;go.textContent='Verifying…';
  let ok=false;try{ok=(await sha256(v))===H;}catch(x){}
  if(!ok){go.disabled=false;go.textContent='Access Report';pwd.classList.add('error');msg.textContent='Incorrect password. Please try again.';pwd.value='';pwd.focus();return;}
  try{
    const bin=atob(R),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();document.write(html);document.close();
  }catch(x){go.disabled=false;go.textContent='Access Report';msg.textContent='The report could not load. Refresh the page and try again.';}
});
</script>
